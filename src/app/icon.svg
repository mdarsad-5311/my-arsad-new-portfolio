<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="favBlue" x1="10" y1="8" x2="22" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- High-contrast badge -->
  <rect width="32" height="32" rx="7" fill="#09090b"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#27272a" stroke-width="1"/>

  <!-- 2-Color Monogram -->
  <g stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <!-- COLOR 1: White M Wings -->
    <path d="M 6 24 L 6 9 L 12.5 17" stroke="#ffffff"/>
    <path d="M 26 24 L 26 9 L 19.5 17" stroke="#ffffff"/>

    <!-- COLOR 2: Electric Cyan/Blue A Delta -->
    <path d="M 11.5 24 L 16 8.5 L 20.5 24" stroke="url(#favBlue)"/>
    <path d="M 13.5 18 L 18.5 18" stroke="url(#favBlue)"/>
  </g>
</svg>
